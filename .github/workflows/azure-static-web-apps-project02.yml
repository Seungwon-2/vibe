name: Deploy Stella Runner

on:
  push:
    branches:
      - project02
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stella-runner-project02-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project02
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check types
        run: npm run typecheck

      - name: Run client tests
        run: npm test -- --run

      - name: Validate managed API
        working-directory: api
        run: |
          npm ci
          npm run lint
          npm test
          npm run build

      - name: Build static frontend
        run: npm run build
        env:
          VITE_ENTRA_TENANT_ID: ${{ vars.VITE_ENTRA_TENANT_ID }}
          VITE_ENTRA_CLIENT_ID: ${{ vars.VITE_ENTRA_CLIENT_ID }}
          VITE_ENTRA_API_SCOPE: ${{ vars.VITE_ENTRA_API_SCOPE }}
          VITE_API_BASE_URL: /api

      - name: Deploy frontend and API to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist
          api_location: api
          api_build_command: npm run build
          output_location: ''
          skip_app_build: true
